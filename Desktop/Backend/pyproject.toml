[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "miktos-streamlab"
version = "0.1.0"
description = "Professional municipal broadcasting platform with AI-powered bilingual transcription"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Miktos StreamLab Team"}
]
keywords = ["streaming", "obs", "broadcasting", "transcription", "bilingual", "municipal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    "obs-websocket-py>=1.0",
    "openai-whisper>=20231117",
    "speedtest-cli>=2.1.3",
    "psutil>=5.9.0",
    "cryptography>=41.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "ffmpeg-python>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
    "isort>=5.12.0",
    "pre-commit>=3.3.3",
]

ui = [
    "PyQt6>=6.5.0",
    "pyqtgraph>=0.13.0",
]

[project.scripts]
miktos = "src.main:main"

[project.urls]
Homepage = "https://github.com/yourusername/miktos-streamlab"
Documentation = "https://github.com/yourusername/miktos-streamlab/docs"
Repository = "https://github.com/yourusername/miktos-streamlab"
"Bug Tracker" = "https://github.com/yourusername/miktos-streamlab/issues"

[tool.setuptools]
packages = ["src", "src.core"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "test_complete_quality_system",
    "test_quality_analyzer",
    "test_quality_panel"
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=core --cov=api --cov-report=html --cov-report=term"
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning:speedtest.*:",
    "ignore:datetime.datetime.utcnow.*:DeprecationWarning:speedtest.*",
]

[tool.coverage.run]
source = ["core", "api", "."]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
