# NGINX Configuration for Miktos StreamLab Dual-Path RTMP
# ==========================================================
# 
# This configuration enables:
# - RTMP server on port 1935 for receiving stream from OBS
# - Dual-output relay to YouTube EN and FR channels
# - Stats page on port 8080 for monitoring
#
# Installation:
# 1. Copy this file: sudo cp nginx-rtmp.conf /opt/homebrew/etc/nginx/nginx.conf
# 2. Add your YouTube stream keys (replace YOUR_EN_KEY and YOUR_FR_KEY)
# 3. Start nginx: brew services start denji/nginx/nginx-full
# 4. Configure OBS to stream to: rtmp://localhost/live/streamlab

#user  nobody;
worker_processes  1;

error_log  /opt/homebrew/var/log/nginx/error.log info;
pid        /opt/homebrew/var/run/nginx.pid;

events {
    worker_connections  1024;
}

# ============================================================================
# RTMP Configuration - The core of dual-path streaming
# ============================================================================
rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        
        # Main streaming application
        application live {
            live on;
            record off;
            
            # IMPORTANT: Add your YouTube stream keys here
            # Get keys from: https://studio.youtube.com -> Go Live -> Stream Key
            
            # YouTube English Channel
            # Replace YOUR_EN_STREAM_KEY with actual key (format: xxxx-xxxx-xxxx-xxxx)
            push rtmp://a.rtmp.youtube.com/live2/YOUR_EN_STREAM_KEY;
            
            # YouTube French Channel  
            # Replace YOUR_FR_STREAM_KEY with actual key (format: xxxx-xxxx-xxxx-xxxx)
            push rtmp://a.rtmp.youtube.com/live2/YOUR_FR_STREAM_KEY;
            
            # Optional: Add more destinations here
            # push rtmp://live.twitch.tv/app/YOUR_TWITCH_KEY;
            # push rtmp://live-api-s.facebook.com:80/rtmp/YOUR_FB_KEY;
            
            # Drop idle connections after 10 seconds
            drop_idle_publisher 10s;
            
            # Allow publishing from localhost only (security)
            allow publish 127.0.0.1;
            allow publish 192.168.0.0/16;  # Local network
            deny publish all;
            
            # Allow playback for testing
            allow play all;
        }
    }
}

# ============================================================================
# HTTP Configuration - Stats page and web server
# ============================================================================
http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /opt/homebrew/var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    gzip  on;

    # RTMP Statistics Page
    server {
        listen       8080;
        server_name  localhost;

        # RTMP statistics in XML format
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }

        # Serve the stat.xsl stylesheet
        location /stat.xsl {
            root /opt/homebrew/share/rtmp-nginx-module;
        }
        
        # Control endpoints (optional - for advanced use)
        location /control {
            rtmp_control all;
        }
        
        # Simple status page
        location / {
            return 200 "NGINX RTMP Server Running\n\nStats: http://localhost:8080/stat\n";
            add_header Content-Type text/plain;
        }
    }

    # Include any additional server configs
    include servers/*;
}
